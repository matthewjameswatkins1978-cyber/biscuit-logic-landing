<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#101214">
  <meta name="description" content="Biscuit Logic — an independent creative technology studio.">
  <title>Biscuit Logic</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%23171b1d%22 stroke=%22%23b8c8cd%22 stroke-width=%224%22/%3E%3Ctext x=%2250%22 y=%2266%22 text-anchor=%22middle%22 font-size=%2252%22%3E%F0%9F%90%87%3C/text%3E%3C/svg%3E">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --ink:#f0ede6; --muted:#b2b0aa; --line:rgba(231,224,211,.19); --accent:#b8c8cd; }
    * { box-sizing:border-box; }
    html, body { min-height:100%; margin:0; }
    body { min-height:100svh; display:grid; place-items:center; overflow:hidden; padding:clamp(1.25rem,5vw,3rem); color:var(--ink); background:radial-gradient(ellipse at 50% 42%, #20272a 0, #171b1d 35%, #101214 76%); font-family:"DM Sans", sans-serif; -webkit-font-smoothing:antialiased; }
    main { width:min(100%, 39rem); display:flex; flex-direction:column; align-items:center; text-align:center; }
    .mark { position:relative; display:grid; place-items:center; width:clamp(9.5rem,25vw,13.5rem); aspect-ratio:1; margin-bottom:clamp(1.8rem,5vh,3rem); }
    .mark::before { content:""; position:absolute; inset:-12%; border:1px solid rgba(184,200,205,.17); border-radius:50%; }
    .mark::after { content:""; position:absolute; inset:-22%; border-radius:50%; background:radial-gradient(circle,rgba(142,170,177,.11),transparent 68%); z-index:-1; }
    .mark svg { width:100%; height:100%; filter:drop-shadow(0 10px 28px rgba(0,0,0,.3)); }
    h1 { margin:0; font-family:"Playfair Display", Georgia, serif; font-size:clamp(2.8rem,8vw,5.1rem); line-height:1; font-weight:500; letter-spacing:-.055em; }
    .signature { margin:1.05rem 0 clamp(2rem,5vh,3rem); color:#c8c2b5; font-size:1rem; line-height:1; }
    .contacts { width:min(100%,31rem); display:flex; align-items:center; justify-content:center; gap:clamp(1.25rem,5vw,2.75rem); padding-top:1.2rem; border-top:1px solid var(--line); }
    .contact-group { display:flex; align-items:center; max-width:100%; }`n    .contact-group > .contact { overflow-wrap:anywhere; }`n    .contact { min-height:2.75rem; display:inline-flex; align-items:center; gap:.55rem; color:var(--muted); font-size:clamp(.78rem,2.7vw,.94rem); text-decoration:none; transition:color .2s ease; }
    .contact:hover { color:var(--ink); }
    .contact:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:5px; border-radius:2px; }
    .contact svg { width:1rem; height:1rem; flex:none; color:#aab9bd; }
    .copy { display:inline-grid; place-items:center; width:2rem; height:2rem; padding:0; border:0; background:transparent; color:#898d8d; cursor:pointer; }
    .copy:hover { color:var(--ink); }
    .status { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:480px) { .contacts { flex-direction:column; gap:.2rem; padding-top:.75rem; } .contact { min-height:2.5rem; } }
    @media (max-height:600px) { body { overflow:auto; } .mark { width:clamp(7rem,23vh,10rem); margin-bottom:1.25rem; } .signature { margin: .75rem 0 1.25rem; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; animation:none!important; } }
  </style>
</head>
<body>
  <main aria-labelledby="title">

          <circle cx="304" cy="155" r="14.5" fill="#68a4e8" />

          <!-- Center Node & Horizontal Conduit -->
          <line x1="250" y1="250" x2="315" y2="250" stroke="#68a4e8" stroke-width="14" stroke-linecap="round" />

          <circle cx="286" cy="355" r="14.5" fill="#68a4e8" />

        <span>GitHub</span><span aria-hidden="true">↗</span>

    </nav>
    <span id="status" class="status" role="status" aria-live="polite"></span>
  </main>
  <script>
    const copyButton = document.querySelector('.copy');
    const status = document.querySelector('#status');
    const email = 'matthewjameswatkins1978@gmail.com';
    copyButton.addEventListener('click', async () => {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(email);
        } else {
          const field = document.createElement('textarea');
          field.value = email;
          field.setAttribute('readonly', '');
          Object.assign(field.style, { position:'fixed', left:'-9999px', top:'0', opacity:'0' });
          document.body.append(field);
          field.select();
          const copied = document.execCommand('copy');
          field.remove();
          if (!copied) throw new Error('Copy was not available');
        }
        status.textContent = 'Email address copied';
      } catch {
        status.textContent = 'Copy unavailable. Select the email address to copy it.';
      }
    });
  </script>
